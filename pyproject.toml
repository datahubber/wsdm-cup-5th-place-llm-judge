[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wsdm-judge"
version = "0.1.0"
description = "Inference and uncertainty-gated post-processing for a pairwise LLM judge (WSDM Cup 2025, 5th place team)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Albert Wang" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=14"]

[project.optional-dependencies]
# GPU inference only. The Kaggle run used vllm 0.6.3.post1 from offline wheels.
infer = ["vllm==0.6.3.post1", "transformers>=4.45"]
# The README figure (scripts/plot_results.py).
plot = ["matplotlib>=3.7"]
# ruff is pinned so a new formatter release cannot turn CI red without a code change.
dev = ["pytest>=8", "ruff==0.16.*", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
